<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"
     fill="none" stroke="#fcfcfc" stroke-width="1.7"
     stroke-linecap="round" stroke-linejoin="round"
     role="img" aria-label="Show duplicate images">
  <title>Show duplicate images</title>

  <!-- Overlapping image cards -->
  <rect x="8" y="3" width="12" height="12" rx="2"/>
  <rect x="4" y="8" width="12" height="12" rx="2"/>

  <!-- Image detail on the front card -->
  <circle cx="8.5" cy="12.5" r="1"/>
  <path d="m5.5 17 3-3 2.2 2.2 1.3-1.3 2 2.1"/>
</svg>
